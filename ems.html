<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETA Beacon – EMS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="ems">
  <h1>ETA Beacon <span>EMS</span></h1>

  <form id="login" hidden>
    <p class="sub">One-time setup for this rig phone.</p>
    <label>Rig login
      <input id="email" type="email" autocomplete="username" placeholder="m10@rigs.etabeacon">
    </label>
    <label>Password
      <input id="password" type="password" autocomplete="current-password">
    </label>
    <button class="big go">Sign in</button>
    <p id="loginMsg" class="sub"></p>
  </form>

  <section id="setup" hidden>
    <div class="unitname" id="unit"></div>
    <label>Destination
      <select id="hospital"></select>
    </label>
    <button id="start" class="big go">Start transport</button>
    <p id="msg" class="sub"></p>
    <button id="signout" class="link">Sign this phone out</button>
  </section>

  <section id="live" hidden>
    <div class="sub" id="dest"></div>
    <div id="phase" class="phase onscene">ON SCENE</div>
    <div class="etarow" id="row-normal">
      <span class="etalabel">No lights &amp; sirens</span>
      <span class="etaval" id="eta-normal">--</span>
    </div>
    <div class="etarow" id="row-ls">
      <span class="etalabel">Lights &amp; sirens</span>
      <span class="etaval" id="eta-ls">--</span>
    </div>
    <div class="sub" id="diff"></div>
    <div class="sub" id="mode"></div>
    <div class="sub" id="dist"></div>
    <div class="sub" id="status"></div>
    <p class="hint">Keep this screen open during transport. Arrival is recorded automatically at the ED entrance.</p>
    <button id="arrived" class="big stop">Arrived</button>
  </section>

  <script type="module" src="ems.js"></script>
</body>
</html>
