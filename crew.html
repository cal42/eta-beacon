<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETA Beacon – Crew</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="crew">
  <h1>ETA Beacon <span>Crew</span></h1>

  <form id="login" hidden>
    <p class="sub">One-time setup for this rig phone.</p>
    <label>Rig login
      <input id="email" type="email" autocomplete="username" placeholder="m10@rigs.etabeacon">
    </label>
    <label>Password
      <input id="password" type="password" autocomplete="current-password">
    </label>
    <button class="big go">Sign in</button>
    <p id="loginMsg" class="sub"></p>
  </form>

  <section id="setup" hidden>
    <div class="unitname" id="unit"></div>
    <label>Destination
      <select id="hospital"></select>
    </label>
    <button id="start" class="big go">Start transport</button>
    <p id="msg" class="sub"></p>
    <button id="signout" class="link">Sign this phone out</button>
  </section>

  <section id="live" hidden>
    <div class="sub" id="dest"></div>
    <div class="eta" id="eta">--</div>
    <div class="sub" id="dist"></div>
    <div class="sub" id="status"></div>
    <p class="hint">Keep this screen open during transport.</p>
    <button id="arrived" class="big stop">Arrived</button>
  </section>

  <script type="module" src="crew.js"></script>
</body>
</html>
